[project]
name = "aichemy"
version = "0.0.1"
description = "Chemo-enzymatic reaction hypergraph preprocessing and MILP profit optimization."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "rdkit>=2024.3",
    "pydantic>=2.6",
    "patito>=0.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy",
    "scipy",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
solver = ["gurobipy>=11.0"]
notebooks = ["jupyter", "pandas", "matplotlib"]
balance = ["synrbl>=1.0.6"]           # optional USPTO atom-balancing (Stage 07)

[project.scripts]
aichemy = "aichemy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichemy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-httpx>=0.36",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit",
    "nbstripout",
    "dvc>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
files = ["src/aichemy"]

[[tool.mypy.overrides]]
module = ["rdkit.*", "patito.*", "yaml", "synrbl", "synrbl.*"]
ignore_missing_imports = true
follow_imports = "skip"

# RDKit lacks type stubs; relax strictness in modules that use it directly.
[[tool.mypy.overrides]]
module = [
    "aichemy.preprocessing.chem.smiles",
    "aichemy.preprocessing.chem.similarity",
    "aichemy.preprocessing.chem.filters",
    "aichemy.preprocessing.chem.identifiers",
    "aichemy.preprocessing.balance.validate",
    "aichemy.preprocessing.balance.syn_rbl",
    "aichemy.preprocessing.normalize",
    "aichemy.preprocessing.dedup.molecules",
    "aichemy.preprocessing.dedup.reactions",
]
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["type-arg", "attr-defined"]

# patito's Model is Any-typed; subclasses and polars schema dicts trigger noise.
[[tool.mypy.overrides]]
module = ["aichemy.preprocessing.io"]
disallow_subclassing_any = false
disable_error_code = ["misc", "arg-type"]
