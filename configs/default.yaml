sources:
  metanetx_version: "4.4"
  uspto_slice: grants_1976_2016
  metanetx_urls:
    reac_prop: https://www.metanetx.org/ftp/4.4/reac_prop.tsv
    chem_prop: https://www.metanetx.org/ftp/4.4/chem_prop.tsv
    reac_xref: https://www.metanetx.org/ftp/4.4/reac_xref.tsv
    chem_xref: https://www.metanetx.org/ftp/4.4/chem_xref.tsv
  uspto_urls:
    # Figshare DOI: 10.6084/m9.figshare.5104873 (Lowe 2017)
    grants_smiles: https://ndownloader.figshare.com/files/8664379
    applications_smiles: https://ndownloader.figshare.com/files/8664370

filter:
  min_carbon_count: 2

dedup:
  tanimoto_threshold: 1.0
  reaction_tanimoto_threshold: 0.95
  fingerprint_radius: 2
  fingerprint_bits: 2048

yields:
  strategy: global_mean
  fixed_value: 0.85
  enzymatic_prior_range: [0.85, 0.95]

prices:
  backend: aichemy_pricing        # stub | chained | aichemy_pricing
  chain: [curated, pubchem]       # consumed only when backend == "chained"
  # When backend == "aichemy_pricing" (the as-shipped default), consumes the
  # standalone aichemy_pricing package via PubChemCompoundResolver — a 3-way
  # JOIN of PubChem Substance (vendor + SKU) + SID-Map (cross-reference) +
  # Compound (InChIKey). See:
  #   docs/superpowers/plans/2026-04-25-aichemy-pricing-package.md  (architecture)
  #   docs/superpowers/plans/2026-04-26-pricing-scalability.md      (scalability + JOIN)
  #
  # First run: fetch the three inputs via:
  #   bash scripts/download_pubchem_substance.sh   (~54 GB, already downloaded)
  #   bash scripts/download_pubchem_compound.sh    (~30 GB, ~1-2 hr)
  #   bash scripts/download_pubchem_sid_map.sh     (~3 GB, ~5-10 min)
  # then run augment-prices once to build `index_cache` (~30-60 min). Subsequent
  # runs deserialize the parquet in ~5 sec.
  aichemy_pricing:
    compound_dir: data/raw/pubchem_compound
    substance_dir: data/raw/pubchem_substance
    sid_map_path: data/raw/pubchem_sid_map/SID-Map.gz
    index_cache: data/interim/aichemy_pricing_index.parquet
    cache_path: data/interim/aichemy_pricing_cache.sqlite

    # Vendor allowlist applied during pass 1 of the JOIN (Substance scan).
    # PubChem Substance has ~1431 sources; loading them all OOMs at full-corpus
    # scale (491M SIDs). This restricts to vendors we actually price via the
    # L2/L3 chain. Values must match the `DSN` column from
    # https://ftp.ncbi.nlm.nih.gov/pubchem/Substance/Extras/Source-Names —
    # i.e., the literal string stored in `PUBCHEM_EXT_DATASOURCE_NAME` in each
    # SDF record. Most are numeric source IDs; a few legacy depositors use a
    # string DSN (Sigma-Aldrich is one).
    #
    # Note: Molbase (Chinese vendor, no PubChem deposit) is in our chain but
    # absent here — its SDFs would have to come from a different source.
    allowed_sources:
      - "822"             # Enamine (5.2M live substances)
      - "959"             # MedChemexpress MCE (117K)
      - "10600"           # Tocris Bioscience (5K)
      - "25659"           # Santa Cruz Biotechnology, Inc. (174K)
      - "29665"           # Fluorochem (96K)
      - "Sigma-Aldrich"   # Sigma-Aldrich (258K) — literal string DSN, not numeric
    max_workers: 100

paths:
  data_dir: data

selection:
  # Curated-subset target. ~40,874 rdkit_balanced rows are pinned;
  # the remainder are filled by TF-IDF mol-overlap with the pinned set.
  target_total: 100000
  seed: 42
  mandatory_column: rdkit_balanced
